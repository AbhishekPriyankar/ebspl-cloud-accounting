<script>
function handleRegister(e) {
  e.preventDefault();
  var terms = document.getElementById('terms');
  if (!terms.checked) {
    terms.style.outline = '2px solid #ba1a1a';
    return;
  }
  var name = (document.getElementById('full_name').value || '').trim() || 'New User';
  var email = (document.getElementById('email').value || '').trim() || 'user@ebspl.com';
  var initial = name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  window.ebsplAuth.save({ name: name, email: email, role: 'Client', initial: initial, loginMethod: 'register' });

  var btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite;display:inline-block">progress_activity</span> Creating account...';
  setTimeout(function() {
    window.location.href = '../ebspl_cloud_accounting_enterprise_dashboard/code.html';
  }, 900);
}
</script>
<script>
function handleGoogleRegister() {
  window.ebsplAuth.googleSignIn(function(userObj) {
    setTimeout(function(){ window.location.href = '../ebspl_cloud_accounting_enterprise_dashboard/code.html'; }, 400);
  });
}

function handleSSORegister() {
  window.ebsplAuth.ssoSignIn(function(userObj) {
    setTimeout(function(){ window.location.href = '../ebspl_cloud_accounting_enterprise_dashboard/code.html'; }, 400);
  });
}
</script>
