<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script>if(!localStorage.getItem('ebspl_user'))window.location.replace('../login_ebspl_2/code.html');</script>
    <title>EBSPL Cloud Accounting - Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="../profiles.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#ec5b13",
                'primary-dark': "#d44d0d",
                surface: "#f1fbff",
                outline: "#797583",
                'outline-variant': "#cac4d3",
                "on-surface-variant": "#484551",
              },
              fontFamily: {
                sans: ['Public Sans', 'Inter', 'sans-serif'],
                display: ['Manrope', 'sans-serif'],
              }
            }
          }
        };
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Public Sans', sans-serif; background-color: #f1fbff; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cac4d3; border-radius: 10px; }
        .sidebar-active { background-color: #ec5b13 !important; color: white !important; }
        @keyframes ebsplFadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .ebspl-modal-enter { animation: ebsplFadeIn .2s ease; }
        @keyframes ebsplSlide { from{transform:translateX(110%);opacity:0} to{transform:translateX(0);opacity:1} }
    </style>
</head>
<body class="bg-surface text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useRef } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        /* ─── Auth helpers ─── */
        const AUTH_KEY = 'ebspl_user';
        const getStoredUser = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } };
        const saveUser = (u) => localStorage.setItem(AUTH_KEY, JSON.stringify(u));
        const clearUser = () => localStorage.removeItem(AUTH_KEY);

        /* ─── Auth Context ─── */
        const AuthCtx = createContext(null);

        /* ─── Profile-aware mock data ─── */
        function getProfileData(user) {
            var fallback = {
                invoices: [
                    { id: 'INV-2024-084', client: 'Acme Solutions Ltd', initials: 'AS', date: 'Oct 12, 2024', due: 'Oct 26, 2024', amount: '£1,250.00', status: 'Paid', color: 'bg-emerald-100 text-emerald-700' },
                    { id: 'INV-2024-085', client: 'Bright Retail Ltd', initials: 'BR', date: 'Oct 14, 2024', due: 'Oct 28, 2024', amount: '£620.00', status: 'Sent', color: 'bg-blue-100 text-blue-700' },
                    { id: 'INV-2024-086', client: 'Nova Systems', initials: 'NS', date: 'Sep 28, 2024', due: 'Oct 12, 2024', amount: '£580.00', status: 'Overdue', color: 'bg-red-100 text-red-700' }
                ],
                contacts: [
                    { name: 'Alex Henderson', initials: 'AH', company: 'Henderson & Co.', email: 'alex@henderson.io', phone: '+44 7700 900005', last: 'Oct 24, 2024', status: 'Active' },
                    { name: 'Sarah Chen', initials: 'SC', company: 'EBSPL', email: 's.chen@gmail.com', phone: '+44 20 7946 0325', last: 'Oct 22, 2024', status: 'Admin' }
                ],
                expenses: [
                    { desc: 'AWS Cloud Services', cat: 'Tech', amount: '-£84.50', date: 'Oct 20, 2024', status: 'Approved' },
                    { desc: 'Office Supplies', cat: 'Operations', amount: '-£45.00', date: 'Oct 19, 2024', status: 'Pending' },
                    { desc: 'Client Lunch', cat: 'Entertainment', amount: '-£78.20', date: 'Oct 18, 2024', status: 'Approved' }
                ],
                transactions: [
                    { t: 'Invoice Payment', amt: '+£1,250.00', date: 'Oct 26', s: 'Matched' },
                    { t: 'AWS Services', amt: '-£84.50', date: 'Oct 20', s: 'Matched' },
                    { t: 'Office Supplies', amt: '-£45.00', date: 'Oct 19', s: 'Pending' },
                    { t: 'Client Lunch', amt: '-£78.20', date: 'Oct 18', s: 'Matched' }
                ],
                stats: { balance: '£12,450.00', outstanding: '£3,870.50', payables: '£1,290.75', profit: '£8,920.00' }
            };
            if (!user) return fallback;
            var prof = window.EBSPL_PROFILES && window.EBSPL_PROFILES.getByEmail(user.email);
            if (!prof || !prof.data) return fallback;
            return {
                invoices: prof.data.invoices && prof.data.invoices.length ? prof.data.invoices : fallback.invoices,
                contacts: prof.data.contacts && prof.data.contacts.length ? prof.data.contacts : fallback.contacts,
                expenses: prof.data.expenses && prof.data.expenses.length ? prof.data.expenses : fallback.expenses,
                transactions: prof.data.transactions && prof.data.transactions.length ? prof.data.transactions : fallback.transactions,
                stats: prof.data.stats ? {
                    balance: prof.data.stats.balance || fallback.stats.balance,
                    outstanding: prof.data.stats.outstanding || fallback.stats.outstanding,
                    payables: prof.data.stats.payables || '£0',
                    profit: prof.data.stats.profit || fallback.stats.profit
                } : fallback.stats
            };
        }

        /* ─── Toast ─── */
        const ToastCtx = createContext(null);
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const push = (msg, type = 'success') => {
                const id = Date.now();
                setToasts(t => [...t, { id, msg, type }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            };
            const colors = { success: '#10b981', error: '#ef4444', info: '#3b82f6', warn: '#f59e0b' };
            return (
                <ToastCtx.Provider value={push}>
                    {children}
                    <div style={{position:'fixed',top:20,right:20,zIndex:99999,display:'flex',flexDirection:'column',gap:8}}>
                        {toasts.map(t => (
                            <div key={t.id} style={{background:colors[t.type]||colors.success,color:'#fff',padding:'12px 18px',borderRadius:10,fontWeight:600,fontSize:13,boxShadow:'0 4px 16px rgba(0,0,0,.15)',maxWidth:320,animation:'ebsplSlide .2s ease'}}>
                                {t.msg}
                            </div>
                        ))}
                    </div>
                </ToastCtx.Provider>
            );
        };
        const useToast = () => useContext(ToastCtx);

        /* ─── Modal ─── */
        const Modal = ({ title, children, onClose, onConfirm, confirmLabel = 'Confirm', wide = false }) => (
            <div className="fixed inset-0 bg-black/50 z-[9000] flex items-center justify-center p-4" onClick={e => e.target === e.currentTarget && onClose()}>
                <div className={`bg-white rounded-2xl shadow-2xl ebspl-modal-enter ${wide ? 'w-full max-w-2xl' : 'w-full max-w-md'} max-h-[90vh] overflow-y-auto`}>
                    <div className="flex items-center justify-between p-6 border-b border-slate-100">
                        <h2 className="text-lg font-bold">{title}</h2>
                        <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                            <span className="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div className="p-6">{children}</div>
                    {onConfirm && (
                        <div className="flex gap-3 justify-end px-6 pb-6">
                            <button onClick={onClose} className="px-5 py-2.5 border border-slate-200 rounded-lg font-semibold text-sm">Cancel</button>
                            <button onClick={onConfirm} className="px-6 py-2.5 bg-primary text-white rounded-lg font-bold text-sm hover:bg-primary-dark">{confirmLabel}</button>
                        </div>
                    )}
                </div>
            </div>
        );

        /* ─── Sidebar ─── */
        const Sidebar = ({ onLogout }) => {
            const location = useLocation();
            const menuItems = [
                { path: '/', label: 'Dashboard', icon: 'dashboard' },
                { path: '/clients', label: 'Clients & Contacts', icon: 'group' },
                { path: '/invoicing', label: 'Invoicing & Billing', icon: 'receipt_long' },
                { path: '/expenses', label: 'Expenses & Payables', icon: 'payments' },
                { path: '/reconciliation', label: 'Bank Reconciliation', icon: 'account_balance' },
                { path: '/statements', label: 'Financial Statements', icon: 'description' },
                { path: '/tax', label: 'Tax & Compliance', icon: 'assignment_turned_in' },
                { path: '/uploads', label: 'Uploads & Documents', icon: 'cloud_upload' },
                { path: '/reports', label: 'Reports', icon: 'analytics' },
                { path: '/settings', label: 'Settings', icon: 'settings' },
            ];
            return (
                <aside className="fixed left-0 h-full w-64 bg-white border-r border-slate-200 flex flex-col py-6 px-4 gap-2 z-50">
                    <div className="flex flex-col gap-1 mb-8 px-2">
                        <h1 className="text-2xl font-bold text-primary">EBSPL</h1>
                        <span className="text-xs font-semibold text-slate-500 uppercase tracking-widest">Cloud Accounting</span>
                    </div>
                    <nav className="flex flex-col gap-1 overflow-y-auto flex-grow custom-scrollbar">
                        {menuItems.map((item) => (
                            <Link key={item.path} to={item.path}
                                className={`flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 ${location.pathname === item.path ? 'sidebar-active shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                <span className="material-symbols-outlined">{item.icon}</span>
                                <span className="text-sm font-semibold">{item.label}</span>
                            </Link>
                        ))}
                    </nav>
                    <div className="mt-auto pt-4 border-t border-slate-200 flex flex-col gap-1">
                        <Link to="/chat" className={`flex items-center gap-3 px-3 py-2 rounded-lg ${location.pathname === '/chat' ? 'sidebar-active' : 'text-slate-600 hover:bg-slate-100'}`}>
                            <span className="material-symbols-outlined">chat</span>
                            <span className="text-sm font-semibold">Chat & Support</span>
                        </Link>
                        <button onClick={onLogout} className="flex items-center gap-3 px-3 py-2 rounded-lg text-red-500 hover:bg-red-50 transition-colors w-full text-left">
                            <span className="material-symbols-outlined">logout</span>
                            <span className="text-sm font-semibold">Sign Out</span>
                        </button>
                    </div>
                </aside>
            );
        };

        /* ─── TopBar ─── */
        const TopBar = ({ user, onLogout }) => {
            const [dropOpen, setDropOpen] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setDropOpen(false); };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, []);
            const initial = user ? (user.initial || (user.name ? user.name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2) : '?')) : '?';
            return (
                <header className="h-16 flex items-center justify-between px-8 w-full bg-white border-b border-slate-200 sticky top-0 z-40">
                    <div className="flex items-center gap-4 flex-1">
                        <div className="relative w-80 max-w-full">
                            <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
                            <input className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-primary text-sm outline-none" placeholder="Search everything..." type="text" />
                        </div>
                    </div>
                    <div className="flex items-center gap-4" ref={ref}>
                        <button className="p-2 text-slate-500 hover:text-primary relative">
                            <span className="material-symbols-outlined">notifications</span>
                            <span className="absolute top-2 right-2 h-2 w-2 bg-red-500 rounded-full border-2 border-white"></span>
                        </button>
                        <button className="p-2 text-slate-500 hover:text-primary">
                            <span className="material-symbols-outlined">help</span>
                        </button>
                        <div className="h-8 w-px bg-slate-200 mx-1"></div>
                        <div className="relative">
                            <button onClick={() => setDropOpen(d => !d)} className="flex items-center gap-3 rounded-lg px-2 py-1 hover:bg-slate-50 transition-colors">
                                <div className="text-right hidden sm:block">
                                    <p className="text-sm font-bold text-slate-900 leading-tight">{(user && user.name) || 'User'}</p>
                                    <p className="text-xs text-slate-500 leading-tight">{(user && user.role) || 'Guest'}</p>
                                </div>
                                <div className="w-9 h-9 rounded-full bg-primary/10 border-2 border-primary/30 flex items-center justify-center font-bold text-sm text-primary">
                                    {initial}
                                </div>
                                <span className="material-symbols-outlined text-slate-400 text-lg">arrow_drop_down</span>
                            </button>
                            {dropOpen && (
                                <div className="absolute right-0 top-full mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
                                    <div className="px-4 py-3 border-b border-slate-100">
                                        <p className="font-bold text-sm">{user && user.name}</p>
                                        <p className="text-xs text-slate-500 truncate">{user && user.email}</p>
                                        {user && user.loginMethod && <span className="text-[10px] bg-primary/10 text-primary px-2 py-0.5 rounded-full font-bold uppercase mt-1 inline-block">{user.loginMethod === 'google' ? 'Google' : user.loginMethod === 'sso' ? 'SSO' : 'Password'}</span>}
                                    </div>
                                    <Link to="/settings" onClick={() => setDropOpen(false)} className="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 text-sm text-slate-700">
                                        <span className="material-symbols-outlined text-lg">manage_accounts</span> Profile & Settings
                                    </Link>
                                    <button onClick={onLogout} className="flex items-center gap-3 px-4 py-2.5 hover:bg-red-50 text-sm text-red-500 w-full text-left">
                                        <span className="material-symbols-outlined text-lg">logout</span> Sign Out
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </header>
            );
        };

        /* ─── Layout ─── */
        const Layout = ({ children, user, onLogout }) => (
            <div className="flex min-h-screen">
                <Sidebar onLogout={onLogout} />
                <main className="flex-1 ml-64 min-h-screen flex flex-col">
                    <TopBar user={user} onLogout={onLogout} />
                    <div className="p-8">{children}</div>
                </main>
            </div>
        );

        /* ─── Dashboard Page ─── */
        const DashboardPage = ({ user, onLogout }) => {
            const toast = useToast();
            const [showQuick, setShowQuick] = useState(false);
            const firstName = (user && user.name) ? user.name.split(' ')[0] : 'there';
            return (
                <Layout user={user} onLogout={onLogout}>
                    {showQuick && (
                        <Modal title="Quick Action" onClose={() => setShowQuick(false)}>
                            <div className="grid grid-cols-2 gap-3">
                                {[['receipt_long','Create Invoice','/invoicing'],['payments','Add Expense','/expenses'],['group','Add Contact','/clients'],['cloud_upload','Upload File','/uploads']].map(([icon,label,path]) => (
                                    <Link key={label} to={path} onClick={() => setShowQuick(false)}
                                        className="flex flex-col items-center gap-2 p-4 border border-slate-200 rounded-xl hover:border-primary hover:bg-primary/5 transition-all cursor-pointer">
                                        <span className="material-symbols-outlined text-primary text-3xl">{icon}</span>
                                        <span className="text-sm font-bold">{label}</span>
                                    </Link>
                                ))}
                            </div>
                        </Modal>
                    )}
                    <div className="space-y-8">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-3xl font-bold">Dashboard</h2>
                                <p className="text-slate-500">Welcome back, {firstName}! Here's your overview.</p>
                            </div>
                            <button onClick={() => setShowQuick(true)} className="bg-primary text-white px-6 py-3 rounded-lg font-bold hover:bg-primary-dark transition-all shadow-lg flex items-center gap-2">
                                <span className="material-symbols-outlined">add</span> Quick Action
                            </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {[
                                { label: 'Total Cash Balance', value: getProfileData(user).stats.balance, change: '+12.5%', icon: 'wallet', color: 'text-blue-600', bg: 'bg-blue-50' },
                                { label: 'Outstanding Receivables', value: getProfileData(user).stats.outstanding, change: '+4.2%', icon: 'receipt_long', color: 'text-indigo-600', bg: 'bg-indigo-50' },
                                { label: 'Payables Due', value: getProfileData(user).stats.payables, change: '-2.1%', icon: 'payments', color: 'text-red-600', bg: 'bg-red-50' },
                                { label: 'Net Profit (YTD)', value: getProfileData(user).stats.profit, change: '+11.8%', icon: 'trending_up', color: 'text-emerald-600', bg: 'bg-emerald-50' },
                            ].map((stat, i) => (
                                <div key={i} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:shadow-md transition-shadow" onClick={() => toast(stat.label + ': ' + stat.value, 'info')}>
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className={`w-12 h-12 ${stat.bg} rounded-lg flex items-center justify-center ${stat.color}`}>
                                            <span className="material-symbols-outlined">{stat.icon}</span>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">{stat.label}</p>
                                            <h3 className="text-xl font-bold">{stat.value}</h3>
                                        </div>
                                    </div>
                                    <span className={`text-xs font-bold px-2 py-1 rounded ${stat.change.startsWith('+') ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                        {stat.change} vs last month
                                    </span>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-12 gap-8">
                            <div className="col-span-12 lg:col-span-8 bg-white p-6 rounded-xl border border-slate-200 shadow-sm min-h-[360px]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-bold">Revenue & Cash Flow</h3>
                                    <select className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 outline-none" onChange={e => toast('Filtering by: ' + e.target.value, 'info')}>
                                        <option>Last 6 months</option><option>Last 12 months</option><option>This Year</option>
                                    </select>
                                </div>
                                <div className="h-56 flex items-end justify-between px-4 border-b border-slate-100">
                                    {[100, 140, 110, 130, 120, 150].map((h, i) => (
                                        <div key={i} className="flex flex-col items-center gap-2 w-1/6 cursor-pointer group" onClick={() => toast('Month ' + (i+1) + ': £' + (h * 85).toLocaleString(), 'info')}>
                                            <div className="flex items-end gap-1 w-full justify-center group-hover:opacity-80">
                                                <div className="w-4 bg-primary rounded-t transition-all" style={{height: h}}></div>
                                                <div className="w-4 bg-slate-300 rounded-t transition-all" style={{height: h*0.6}}></div>
                                            </div>
                                            <span className="text-[10px] text-slate-400">M{i+1}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-4 mt-4">
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 bg-primary rounded"></div><span className="text-xs text-slate-500">Income</span></div>
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 bg-slate-300 rounded"></div><span className="text-xs text-slate-500">Expenses</span></div>
                                </div>
                            </div>
                            <div className="col-span-12 lg:col-span-4 space-y-6">
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h3 className="text-lg font-bold mb-4">Recent Activity</h3>
                                    <div className="space-y-4">
                                        {[
                                            { t: 'Invoice Paid', d: 'Acme Solutions Ltd', v: '+£1,250', i: 'check_circle', c: 'text-emerald-500' },
                                            { t: 'Bank Reconciled', d: '28 transactions', v: '', i: 'sync', c: 'text-blue-500' },
                                            { t: 'Receipt Uploaded', d: 'Office Supplies', v: '', i: 'description', c: 'text-indigo-500' },
                                        ].map((act, i) => (
                                            <div key={i} className="flex gap-4 items-start cursor-pointer hover:bg-slate-50 p-2 rounded-lg -m-2" onClick={() => toast(act.t + ' — ' + act.d, 'info')}>
                                                <span className={`material-symbols-outlined ${act.c}`}>{act.i}</span>
                                                <div className="flex-1">
                                                    <p className="text-sm font-bold">{act.t}</p>
                                                    <p className="text-xs text-slate-500">{act.d}</p>
                                                </div>
                                                <span className="text-sm font-bold text-emerald-600">{act.v}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </Layout>
            );
        };

        /* ─── Clients Page ─── */
        const ClientsPage = ({ user, onLogout }) => {
            const toast = useToast();
            const [contacts, setContacts] = useState(() => getProfileData(user).contacts);
            const [showAdd, setShowAdd] = useState(false);
            const [showDetail, setShowDetail] = useState(null);
            const [form, setForm] = useState({ name: '', company: '', email: '', phone: '', status: 'Active' });
            return (
                <Layout user={user} onLogout={onLogout}>
                    {showAdd && (
                        <Modal title="Add New Contact" onClose={() => setShowAdd(false)} onConfirm={() => {
                            if (!form.name) { toast('Name is required', 'error'); return; }
                            const initials = form.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                            setContacts(c => [...c, { ...form, initials, last: new Date().toLocaleDateString('en-GB', {month:'short',day:'numeric',year:'numeric'}) }]);
                            setShowAdd(false); setForm({ name:'',company:'',email:'',phone:'',status:'Active' });
                            toast('Contact added: ' + form.name, 'success');
                        }} confirmLabel="Add Contact">
                            <div className="space-y-4">
                                {[['Full Name','name','text'],['Company','company','text'],['Email','email','email'],['Phone','phone','tel']].map(([label,key,type]) => (
                                    <div key={key}>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">{label}</label>

        /* ─── Error Boundary ─── */
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { err: null }; }
            static getDerivedStateFromError(err) { return { err: err }; }
            componentDidCatch(err, info) { console.error('EBSPL ErrorBoundary:', err, info); }
            render() {
                if (this.state.err) {
                    return (
                        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1fbff',fontFamily:'Inter,sans-serif'}}>
                            <div style={{background:'#fff',borderRadius:16,padding:40,maxWidth:480,width:'90%',boxShadow:'0 8px 40px rgba(0,0,0,.1)',textAlign:'center'}}>
                                <span style={{fontSize:48}}>⚠️</span>
                                <h2 style={{fontWeight:700,fontSize:20,margin:'16px 0 8px'}}>Something went wrong</h2>
                                <p style={{color:'#64748b',fontSize:14,marginBottom:24}}>{String(this.state.err)}</p>
                                <button onClick={() => { localStorage.removeItem('ebspl_user'); window.location.reload(); }} style={{background:'#ec5b13',color:'#fff',border:'none',borderRadius:8,padding:'12px 24px',fontWeight:700,fontSize:14,cursor:'pointer'}}>Clear session &amp; reload</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        /* ─── App ─── */
        const App = () => {
            const [user, setUser] = useState(() => getStoredUser());

            const handleLogin = (u) => { setUser(u); };
            const handleLogout = () => { clearUser(); window.location.href = '/'; };

            if (!user) return (
                <ToastProvider>
                    <MemoryRouter>
                        <LoginPage onLogin={handleLogin} />
                    </MemoryRouter>
                </ToastProvider>
            );

            return (
                <ToastProvider>
                    <MemoryRouter>
                        <Routes>
                            <Route path="/" element={<DashboardPage user={user} onLogout={handleLogout} />} />
                            <Route path="/clients" element={<ClientsPage user={user} onLogout={handleLogout} />} />
                            <Route path="/invoicing" element={<InvoicingPage user={user} onLogout={handleLogout} />} />
                            <Route path="/expenses" element={<ExpensesPage user={user} onLogout={handleLogout} />} />
                            <Route path="/reconciliation" element={<ReconciliationPage user={user} onLogout={handleLogout} />} />
                            <Route path="/statements" element={<StatementsPage user={user} onLogout={handleLogout} />} />
                            <Route path="/tax" element={<TaxPage user={user} onLogout={handleLogout} />} />
                            <Route path="/uploads" element={<UploadsPage user={user} onLogout={handleLogout} />} />
                            <Route path="/reports" element={<ReportsPage user={user} onLogout={handleLogout} />} />
                            <Route path="/settings" element={<SettingsPage user={user} onLogout={handleLogout} />} />
                            <Route path="/chat" element={<ChatPage user={user} onLogout={handleLogout} />} />
                        </Routes>
                    </MemoryRouter>
                </ToastProvider>
            );
        };

        createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
