<body class="font-body-md text-on-surface">
    <div id="root"></div>

    <!-- React and Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="../profiles.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        /* ── Auth helpers ── */
        var FMS_AUTH_KEY = 'ebspl_user';
        function fmsGetUser() { try { return JSON.parse(localStorage.getItem(FMS_AUTH_KEY)); } catch (e) { return null; } }
        function fmsSaveUser(u) { localStorage.setItem(FMS_AUTH_KEY, JSON.stringify(u)); }
        function fmsClearUser() { localStorage.removeItem(FMS_AUTH_KEY); }

        // Shared Components
        const SideNavBar = () => {
            const location = useLocation();
            const isActive = (path) => location.pathname === path;

            const navItems = [
                { path: "/", icon: "dashboard", label: "Dashboard" },
                { path: "/clients", icon: "group", label: "Clients" },
                { path: "/invoicing", icon: "receipt_long", label: "Invoicing" },
                { path: "/expenses", icon: "payments", label: "Expenses" },
                { path: "/reconciliation", icon: "account_balance", label: "Reconciliation" },
                { path: "/statements", icon: "description", label: "Statements" },
                { path: "/compliance", icon: "assignment_turned_in", label: "Compliance" },
                { path: "/documents", icon: "cloud_upload", label: "Documents" },
                { path: "/reports", icon: "analytics", label: "Reports" },
            ];

            return (
                <aside className="bg-surface-container dark:bg-surface-container-low h-screen w-64 fixed left-0 top-0 overflow-y-auto border-r border-outline-variant dark:border-outline flex flex-col py-container-padding z-50">
                    <div className="px-6 mb-8">
                        <h1 className="font-display-lg text-display-lg font-bold text-primary dark:text-primary-fixed">EBSPL</h1>
                        <p className="text-on-surface-variant text-xs font-label-bold">Financial Management</p>
                    </div>
                    <nav className="flex-1 flex flex-col gap-1 px-4">
                        {navItems.map(item => (
                            <Link 
                                key={item.path}
                                to={item.path} 
                                className={`flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant transition-colors duration-200 hover:bg-surface-container-high ${isActive(item.path) ? 'active-link' : ''}`}
                            >
                                <span className="material-symbols-outlined">{item.icon}</span>
                                <span className="font-body-md">{item.label}</span>
                            </Link>
                        ))}
                    </nav>
                    <div className="mt-auto px-4 flex flex-col gap-1">
                        <Link to="/chat" className={`flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors ${isActive('/chat') ? 'active-link' : ''}`}>
                            <span className="material-symbols-outlined">chat</span>
                            <span className="font-body-md">Support</span>
                        </Link>
                        <Link to="/settings" className={`flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors ${isActive('/settings') ? 'active-link' : ''}`}>
                            <span className="material-symbols-outlined">settings</span>
                            <span className="font-body-md">Settings</span>
                        </Link>
                    </div>
                </aside>
            );
        };

        const TopAppBar = ({ user, onLogout }) => {
            const navigate = useNavigate();
            const [dropOpen, setDropOpen] = useState(false);
            var ref = useRef(null);
            useEffect(function() {
                var handler = function(e) { if (ref.current && !ref.current.contains(e.target)) setDropOpen(false); };
                document.addEventListener('mousedown', handler);
                return function() { document.removeEventListener('mousedown', handler); };
            }, []);
            var displayName = (user && user.name) || 'Guest';
            var displayRole = (user && user.role) || '';
            var displayInitial = (user && user.initial) || (user && user.name ? user.name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2) : 'GU');
            return (
                <header className="bg-surface dark:bg-inverse-surface fixed top-0 right-0 w-[calc(100%-16rem)] z-40 border-b border-outline-variant dark:border-outline shadow-sm flex items-center justify-between px-container-padding h-16 ml-64">
                    <div className="flex items-center gap-4 flex-1">
                        <div className="relative w-full max-w-md">
                            <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                            <input className="w-full pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-body-sm focus:outline-none focus:border-primary" placeholder="Search..." type="text"/>
                        </div>
                    </div>
                    <div className="flex items-center gap-4" ref={ref}>
                        <button className="hover:bg-surface-container rounded-full p-2"><span className="material-symbols-outlined text-on-surface-variant">notifications</span></button>
                        <button className="hover:bg-surface-container rounded-full p-2"><span className="material-symbols-outlined text-on-surface-variant">help</span></button>
                        <div className="relative pl-2 border-l border-outline-variant">
                            <button onClick={function(){setDropOpen(function(d){return !d;})}} className="flex items-center gap-3 cursor-pointer rounded-lg px-2 py-1 hover:bg-surface-container transition-colors">
                                <div className="text-right hidden sm:block">
                                    <p className="text-label-bold font-bold leading-none text-on-surface">{displayName}</p>
                                    <p className="text-[10px] text-on-surface-variant uppercase">{displayRole}</p>
                                </div>
                                <div className="h-8 w-8 rounded-full bg-primary/10 border-2 border-primary/30 flex items-center justify-center font-bold text-xs text-primary">
                                    {displayInitial}
                                </div>
                                <span className="material-symbols-outlined text-on-surface-variant text-lg">arrow_drop_down</span>
                            </button>
                            {dropOpen && (
                                <div className="absolute right-0 top-full mt-2 w-52 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-xl z-50 overflow-hidden">
                                    <div className="px-4 py-3 border-b border-outline-variant">
                                        <p className="font-bold text-sm text-on-surface">{displayName}</p>
                                        <p className="text-xs text-on-surface-variant truncate">{user && user.email}</p>
                                    </div>
                                    <Link to="/settings" onClick={function(){setDropOpen(false);}} className="flex items-center gap-3 px-4 py-2.5 hover:bg-surface-container text-sm text-on-surface">
                                        <span className="material-symbols-outlined text-lg">manage_accounts</span> Settings
                                    </Link>
                                    <button onClick={onLogout} className="flex items-center gap-3 px-4 py-2.5 hover:bg-red-50 text-sm text-red-500 w-full text-left">
                                        <span className="material-symbols-outlined text-lg">logout</span> Sign Out
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </header>
            );
        };

        /* ── Auth Context ── */
        var FmsAuthCtx = React.createContext(null);

        // Screen Components
        const LoginPage = ({ onLogin }) => {
            const navigate = useNavigate();
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);

            function nameFromEmail(e) {
                var local = (e || '').split('@')[0].replace(/[._\-+]/g, ' ');
                return local.split(' ').map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ').trim() || 'User';
            }

            function doLogin(userObj) {
                setLoading(true);
                fmsSaveUser(userObj);
                setTimeout(function() { onLogin(userObj); navigate('/'); setLoading(false); }, 600);
            }

            function handleSignIn(e) {
                e.preventDefault();
                if (!email || !email.trim()) {
                    alert('Please enter your email address.');
                    return;
                }
                var em = email.trim();
                var name = nameFromEmail(em);
                var initial = name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
                doLogin({ name: name, email: em, role: 'Admin', initial: initial, loginMethod: 'password' });
            }

            function handleGoogle() {
                window.ebsplAuth.googleSignIn(function(u) { doLogin(u); });
            }
            function handleSSO() {
                window.ebsplAuth.ssoSignIn(function(u) { doLogin(u); });
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-container-padding font-body-md text-on-surface" style={{backgroundImage: 'radial-gradient(#644eaf15 1px, transparent 1px)', backgroundSize: '24px 24px'}}>
                    <div className="w-full max-w-[1000px] grid grid-cols-1 md:grid-cols-2 bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden border border-outline-variant">
                        <div className="hidden md:flex flex-col justify-between p-stack-lg bg-primary relative overflow-hidden text-white">
                            <div className="relative z-10">
                                <div className="flex items-center gap-2 mb-8">
                                    <span className="material-symbols-outlined text-3xl">account_balance</span>
                                    <span className="font-title-sm font-extrabold tracking-tight">EBSPL</span>
                                </div>
                                <h1 className="font-display-lg text-white mb-4">Manage your financial future with clarity.</h1>
                                <p className="opacity-80 max-w-xs">Access the industry's most trusted cloud accounting platform.</p>
                            </div>
                            <div className="relative z-10 grid grid-cols-1 gap-4 mt-12">
                                <div className="p-4 bg-primary-container/40 rounded-lg border border-primary-fixed-dim/20 backdrop-blur-sm">
                                    <span className="material-symbols-outlined text-tertiary-fixed-dim mb-2">security</span>
                                    <h3 className="font-label-bold text-white mb-1">Encrypted Security</h3>
                                    <p className="text-[11px] opacity-70">Enterprise-grade protection for all your sensitive financial data.</p>
                                </div>
                            </div>
                        </div>
                        <div className="p-stack-lg flex flex-col justify-center bg-white">
                            <div className="max-w-md mx-auto w-full">
                                <h2 className="font-headline-md text-primary mb-2">Welcome Back</h2>
                                <p className="text-on-surface-variant mb-6">Please enter your credentials to continue.</p>
                                <form className="space-y-4" onSubmit={handleSignIn}>
                                    <div>
                                        <label className="block text-label-bold text-on-surface-variant mb-1">EMAIL ADDRESS</label>
                                        <input className="w-full p-3 bg-surface-container-low border border-outline-variant rounded-lg" type="email" placeholder="john@company.com" value={email} onChange={function(e){setEmail(e.target.value);}} />
                                    </div>
                                    <div>
                                        <label className="block text-label-bold text-on-surface-variant mb-1">PASSWORD</label>
                                        <input className="w-full p-3 bg-surface-container-low border border-outline-variant rounded-lg" type="password" placeholder="••••••••" />
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full py-4 bg-primary text-white rounded-lg font-bold shadow-lg mt-4 disabled:opacity-70">
                                        {loading ? 'Signing in...' : 'Sign In'}
                                    </button>
                                </form>
                                <div className="flex items-center gap-3 my-4">
                                    <div className="flex-grow h-px bg-outline-variant"></div>
                                    <span className="text-xs text-on-surface-variant font-bold uppercase">or</span>
                                    <div className="flex-grow h-px bg-outline-variant"></div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={handleGoogle} className="flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg font-bold text-sm hover:bg-surface-container transition-colors">
                                        <img src="https://www.google.com/favicon.ico" className="w-4 h-4" onerror="this.style.display='none'" alt="G" /> Google
                                    </button>
                                    <button type="button" onClick={handleSSO} className="flex items-center justify-center gap-2 py-3 border border-outline-variant rounded-lg font-bold text-sm hover:bg-surface-container transition-colors">
                                        <span className="material-symbols-outlined text-lg">business</span> SSO
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, onLogout }) => (
            <div className="ml-64 mt-16 p-container-padding">
                <TopAppBar user={user} onLogout={onLogout} />
                <div className="max-w-6xl mx-auto py-8">
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-display-lg font-display-lg text-primary">Financial Dashboard</h2>
                            <p className="text-on-surface-variant">Welcome back, John. Here's your business at a glance.</p>
                        </div>
                        <Link to="/onboarding" className="bg-primary text-white px-6 py-2 rounded-lg font-bold">New Onboarding</Link>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-gutter mb-8">
                        <div className="bg-white p-6 rounded-xl card-shadow border border-outline-variant">
                            <p className="text-label-bold text-on-surface-variant">BANK BALANCE</p>
                            <h3 className="text-display-lg text-primary">$12,450.00</h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl card-shadow border border-outline-variant">
                            <p className="text-label-bold text-on-surface-variant">TOTAL SENT</p>
                            <h3 className="text-display-lg text-secondary">$2,450.00</h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl card-shadow border border-outline-variant">
                            <p className="text-label-bold text-on-surface-variant text-error">OVERDUE</p>
                            <h3 className="text-display-lg text-error">$580.00</h3>
                        </div>
                    </div>
                    <div className="grid grid-cols-12 gap-gutter">
                        <div className="col-span-12 lg:col-span-8 bg-white rounded-xl card-shadow border border-outline-variant overflow-hidden">
                            <div className="p-6 border-b border-outline-variant flex justify-between">
                                <h3 className="font-title-sm text-primary">Recent Activity</h3>
                                <Link to="/reports" className="text-primary text-sm font-bold">View Reports</Link>
                            </div>
                            <div className="p-6">
                                <div className="space-y-4">
                                    {[1, 2, 3, 4].map(i => (
                                        <div key={i} className="flex items-center justify-between py-2 border-b border-outline-variant last:border-0">
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 bg-primary-fixed rounded-lg flex items-center justify-center text-primary">
                                                    <span className="material-symbols-outlined">receipt</span>
                                                </div>
                                                <div>
                                                    <p className="font-bold">Invoice #884{i}</p>
                                                    <p className="text-xs text-on-surface-variant">Paid by Acme Solutions Ltd</p>
                                                </div>
                                            </div>
                                            <p className="font-bold text-on-tertiary-container">$1,250.00</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <div className="col-span-12 lg:col-span-4 space-y-gutter">
                            <div className="bg-primary text-white p-6 rounded-xl">
                                <h3 className="font-title-sm mb-2">Compliance Alert</h3>
                                <p className="text-sm opacity-80 mb-4">Your VAT return for Q3 is due in 12 days.</p>
                                <Link to="/compliance" className="bg-white text-primary px-4 py-2 rounded-lg text-xs font-bold block text-center">View Deadlines</Link>
                            </div>
                            <div className="bg-surface-container-low p-6 rounded-xl border border-outline-variant">
                                <h3 className="font-title-sm text-primary mb-4">Support Active</h3>
                                <div className="flex items-center gap-3">
                                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5GMkwNKW9oJSy-AhDoCgFujB8aIg-2i0n06muOxOtwK9nDzReFF7LtXhQIKreaMqLMwSepUouDl06ZqKM6Az8r_4zLzTcp2tJ2KjL6K2-VDsdv5lPdnH41NuvGQLnNGj5H6MyjRAipoNnkD74kmx7z3mNdAiO4egK3rc831qntqavH4xF6KPTVHvZOny2T_FU7BJOyYkKBsbQLIdUt7Sv-Iq8cIuXWJsrvMWxplNkk5XZWM_9knB08c0zwHTeo5ODCEh_zVPvpXU" className="w-10 h-10 rounded-full" alt="Sarah" />
                                    <div>
                                        <p className="font-bold">Sarah</p>
                                        <p className="text-xs">Accounting Specialist</p>
                                    </div>
                                </div>
                                <Link to="/chat" className="text-primary text-xs font-bold mt-4 block">Continue Conversation →</Link>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const ClientsPage = ({ user, onLogout }) => (
            <div className="ml-64 mt-16 p-container-padding">
                <TopAppBar user={user} onLogout={onLogout} />
                <div className="max-w-6xl mx-auto py-8">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-display-lg text-primary">Clients & Contacts</h2>
                        <button className="bg-primary text-white px-6 py-2 rounded-lg font-bold">+ New Contact</button>
                    </div>
                    <div className="bg-white rounded-xl card-shadow border border-outline-variant overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-surface-container-low">
                                    <tr>
                                        <th className="p-4 text-label-bold text-on-surface-variant">NAME</th>
                                        <th className="p-4 text-label-bold text-on-surface-variant">COMPANY</th>
                                        <th className="p-4 text-label-bold text-on-surface-variant">EMAIL</th>
                                        <th className="p-4 text-label-bold text-on-surface-variant text-right">LAST CONTACT</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-outline-variant">
                                    {[
                                        { name: "Alex Henderson", company: "Henderson & Co.", email: "alex@henderson.io", date: "Oct 24, 2023" },
                                        { name: "Sarah Chen", company: "Apex Dynamics", email: "s.chen@apexdyn.com", date: "Oct 22, 2023" },
                                        { name: "Marcus Jensen", company: "Jensen Logistics", email: "marcus@jensenlog.net", date: "Oct 21, 2023" },
                                        { name: "David Miller", company: "Miller Creative", email: "david@miller.cr", date: "Oct 15, 2023" }
                                    ].map((client, idx) => (

        };

        const root = createRoot(document.getElementById('root'));
        root.render(
            <MemoryRouter initialEntries={[fmsGetUser() ? '/' : '/login']}>
                <App />
            </MemoryRouter>
        );
    </script>
<script src="../auth.js"></script></body>
</html>
